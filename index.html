<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보상판매장비 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
/* 로그인 */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#111827,#1e293b);display:flex;align-items:center;justify-content:center;z-index:2000}
#login .box{background:#fff;border-radius:16px;padding:36px 32px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#login h1{font-size:18px;font-weight:800;color:#0f172a;margin-bottom:4px}
#login p{font-size:12px;color:#94a3b8;margin-bottom:22px}
#login input{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px;margin-bottom:10px}
#login button{width:100%;padding:11px;background:#4f46e5;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer}
#loginErr{color:#ef4444;font-size:12px;margin-top:10px;min-height:14px}
/* 레이아웃 */
#app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#0f172a;color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:22px 20px;font-size:15px;font-weight:800;color:#fff;line-height:1.4}
.sidebar .brand span{font-size:11px;font-weight:500;color:#64748b;display:block;margin-top:2px}
.nav-item{padding:11px 20px;font-size:13px;cursor:pointer;display:flex;gap:9px;align-items:center;border-left:3px solid transparent}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:#1e293b;color:#fff;border-left-color:#6366f1}
.sidebar .foot{margin-top:auto;padding:16px 20px;font-size:11px;color:#64748b;border-top:1px solid #1e293b}
.sidebar .foot b{color:#cbd5e1;display:block;font-size:12px}
.sidebar .foot button{margin-top:8px;background:none;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer}
.main{flex:1;padding:24px 28px;max-width:1500px}
.page{display:none}.page.active{display:block}
.ptitle{font-size:19px;font-weight:700;color:#0f172a;margin-bottom:4px}
.psub{font-size:12px;color:#94a3b8;margin-bottom:18px}
/* 카드/KPI */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kc{background:#fff;border:1px solid #e8edf3;border-radius:14px;padding:15px 16px;border-left:4px solid #cbd5e1}
.kc .l{font-size:11px;color:#64748b;margin-bottom:7px;font-weight:500}
.kc .v{font-size:22px;font-weight:700;color:#0f172a;letter-spacing:-.5px}
.kc .d{font-size:11px;color:#94a3b8;margin-top:5px}
.sec{margin-bottom:22px}
.st{font-size:13px;font-weight:700;color:#334155;margin-bottom:11px}
.card{background:#fff;border:1px solid #e8edf3;border-radius:14px;padding:6px 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.sidebar{display:none}}
/* 테이블 */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;color:#94a3b8;font-weight:600;font-size:11px;padding:9px 12px;border-bottom:1px solid #eef2f7;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid #f4f7fa;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover td{background:#f7fafc}
.num{text-align:right}
.bar{height:8px;background:#eef2f7;border-radius:4px;overflow:hidden}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-ok{background:#dcfce7;color:#16a34a}.b-no{background:#fee2e2;color:#dc2626}.b-refurb{background:#dbeafe;color:#1d4ed8}.b-scrap{background:#f1f5f9;color:#64748b}.b-etc{background:#fef9c3;color:#b45309}
/* 필터 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input,.filters select{padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
/* 모달 */
#modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
#modal .mb{background:#fff;border-radius:14px;max-width:960px;width:94vw;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.28)}
#modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #eef2f7;position:sticky;top:0;background:#fff}
#modal .mh h3{font-size:15px;font-weight:800;color:#0f172a}
#modal .x{background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8}
.dl{display:grid;grid-template-columns:130px 1fr;gap:0;font-size:13px}
.dl dt{color:#64748b;padding:9px 22px;border-bottom:1px solid #f4f7fa;background:#fafcff}
.dl dd{padding:9px 22px;border-bottom:1px solid #f4f7fa;font-weight:500}
#pdffab{position:fixed;right:22px;bottom:22px;background:#4f46e5;color:#fff;border:none;border-radius:24px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:90}
@media print{.sidebar,.filters,#pdffab,#modal{display:none!important}.main{padding:0;max-width:none}@page{size:A4 landscape;margin:9mm}*{print-color-adjust:exact}}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h1>♻️ 보상판매장비 관리</h1><p>원텍 보상판매(트레이드인) 장비 관리대장</p>
  <input type="email" id="lgEmail" placeholder="이메일" autocomplete="username">
  <input type="password" id="lgPw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">로그인</button>
  <div id="loginErr"></div>
</div></div>

<div id="app" class="hide">
  <div class="sidebar">
    <div class="brand">♻️ 보상판매장비<span>관리대장</span></div>
    <div class="nav-item active" data-p="dash" onclick="showPage('dash')">📊 대시보드</div>
    <div class="nav-item" data-p="list" onclick="showPage('list')">📋 회수 내역</div>
    <div class="nav-item" data-p="uncol" onclick="showPage('uncol')">⚠️ 미회수</div>
    <div class="nav-item" data-p="refurb" onclick="showPage('refurb')">🔄 리퍼 재고</div>
    <div class="foot"><b id="fUser">-</b><span id="fAsOf"></span><br><button onclick="doLogout()">로그아웃</button></div>
  </div>
  <div class="main">
    <div class="page active" id="page-dash">
      <div class="ptitle">📊 대시보드</div><div class="psub" id="dashSub">보상판매 회수장비 현황</div>
      <div class="kpi" id="dashKpi"></div>
      <div class="sec"><div class="st">⚠️ 조치 필요</div><div class="kpi" id="dashAction" style="margin-bottom:0"></div></div>
      <div class="grid2">
        <div class="sec"><div class="st">🔧 회수장비별 현황 <span style="font-weight:400;color:#94a3b8;font-size:11px">(클릭 시 내역)</span></div><div class="card"><table><thead id="dashDevHead"></thead><tbody id="dashDevBody"></tbody></table></div></div>
        <div class="sec"><div class="st">👤 영업담당별 현황 <span style="font-weight:400;color:#94a3b8;font-size:11px">(클릭 시 내역)</span></div><div class="card"><table><thead id="dashRepHead"></thead><tbody id="dashRepBody"></tbody></table></div></div>
      </div>
      <div class="sec"><div class="st">📅 연도별 회수 추이</div><div class="card"><table><thead id="dashYrHead"></thead><tbody id="dashYrBody"></tbody></table></div></div>
    </div>

    <div class="page" id="page-list">
      <div class="ptitle">📋 회수 내역</div><div class="psub">보상판매로 회수한 장비 전체 내역</div>
      <div class="filters">
        <input type="text" id="fSearch" placeholder="거래처/시리얼/장비 검색" oninput="renderList()" style="min-width:220px">
        <select id="fDev" onchange="renderList()"></select>
        <select id="fRep" onchange="renderList()"></select>
        <select id="fStatus" onchange="renderList()">
          <option value="">전체 상태</option><option value="comp0">보상 미처리</option><option value="paid0">미입금</option><option value="usage0">활용 미정</option><option value="refurb">리퍼</option><option value="scrap">폐기</option>
        </select>
        <select id="fYear" onchange="renderList()"><option value="">전체 연도</option></select>
      </div>
      <div class="card"><table><thead id="listHead"></thead><tbody id="listBody"></tbody></table></div>
      <div id="listFoot" style="font-size:12px;color:#64748b;padding:10px 4px"></div>
    </div>

    <div class="page" id="page-uncol">
      <div class="ptitle">⚠️ 미회수 리스트</div><div class="psub">보상 약속했으나 아직 반납되지 않은 장비 (회수 필요)</div>
      <div class="filters"><input type="text" id="uSearch" placeholder="거래처/시리얼 검색" oninput="renderUncol()" style="min-width:220px"></div>
      <div class="card"><table><thead id="uncolHead"></thead><tbody id="uncolBody"></tbody></table></div>
      <div id="uncolFoot" style="font-size:12px;color:#64748b;padding:10px 4px"></div>
    </div>

    <div class="page" id="page-refurb">
      <div class="ptitle">🔄 리퍼 재고 · 출고</div><div class="psub">리퍼(재활용) 처리된 장비의 재고 및 출고 현황</div>
      <div class="kpi" id="refurbKpi"></div>
      <div class="filters"><input type="text" id="rSearch" placeholder="시리얼/장비 검색" oninput="renderRefurb()" style="min-width:220px">
        <select id="rStatus" onchange="renderRefurb()"><option value="">전체</option><option value="stock">재고(미출고)</option><option value="out">출고완료</option></select></div>
      <div class="card"><table><thead id="refurbHead"></thead><tbody id="refurbBody"></tbody></table></div>
      <div id="refurbFoot" style="font-size:12px;color:#64748b;padding:10px 4px"></div>
    </div>
  </div>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="mb">
  <div class="mh"><h3 id="mTitle"></h3><button class="x" onclick="closeModal()">&#10005;</button></div>
  <div id="mBody"></div>
</div></div>
<button id="pdffab" onclick="window.print()">📄 PDF</button>

<script>
var SUPABASE_URL='https://mhfacbsittfdkknwybhc.supabase.co';
var SUPABASE_KEY='sb_publishable_aPMOOWAlyJlMcP1ZM_gpPA_jlrcvCRd';
var _sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var DATA={items:[],uncollected:[],asOf:''};

async function doLogin(){
  var email=document.getElementById('lgEmail').value.trim(), pw=document.getElementById('lgPw').value;
  document.getElementById('loginErr').textContent='';
  var r=await _sb.auth.signInWithPassword({email:email,password:pw});
  if(r.error){ document.getElementById('loginErr').textContent='❌ 이메일 또는 비밀번호가 올바르지 않습니다'; return; }
  boot(r.data.user);
}
async function doLogout(){ await _sb.auth.signOut(); location.reload(); }
async function boot(user){
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('fUser').textContent=(user&&user.email)||'';
  var r=await _sb.from('cons_cache').select('data').eq('key','tradein').maybeSingle();
  DATA=(r.data&&r.data.data)||{items:[],uncollected:[],asOf:''};
  document.getElementById('fAsOf').textContent='기준 '+(DATA.asOf||'-');
  initFilters();
  showPage('dash');
}
window.addEventListener('DOMContentLoaded',async function(){
  var s=await _sb.auth.getSession();
  if(s.data.session){ boot(s.data.session.user); }
});

function showPage(p){
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.getAttribute('data-p')===p);});
  sessionStorage.setItem('ti_page',p);
  if(p==='dash')renderDash(); else if(p==='list')renderList(); else if(p==='uncol')renderUncol(); else if(p==='refurb')renderRefurb();
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function dq(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
function usageBadge(u){ if(u==='리퍼')return '<span class="badge b-refurb">리퍼</span>'; if(u==='폐기')return '<span class="badge b-scrap">폐기</span>'; if(!u)return '<span class="badge b-etc">미정</span>'; return '<span class="badge b-etc">'+esc(u)+'</span>'; }
function ynBadge(b,yes,no){ return b?'<span class="badge b-ok">'+yes+'</span>':'<span class="badge b-no">'+no+'</span>'; }

function initFilters(){
  var items=DATA.items||[];
  function opts(id,vals,label){ var el=document.getElementById(id); el.innerHTML='<option value="">'+label+'</option>'+vals.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join(''); }
  var devs={},reps={},yrs={};
  items.forEach(function(x){ if(x.recovDev)devs[x.recovDev]=1; if(x.rep)reps[x.rep]=1; var y=(x.returnDate||'').slice(0,4); if(y&&y.length===4)yrs[y]=1; });
  opts('fDev',Object.keys(devs).sort(),'전체 회수장비');
  opts('fRep',Object.keys(reps).sort(),'전체 담당');
  document.getElementById('fYear').innerHTML='<option value="">전체 연도</option>'+Object.keys(yrs).sort().reverse().map(function(y){return '<option value="'+y+'">'+y+'년</option>';}).join('');
}

/* ── 대시보드 ── */
function renderDash(){ renderDashK(); }
function renderDashK(){
  var it=DATA.items||[];
  var comp=it.filter(function(x){return x.comp;}).length, paid=it.filter(function(x){return x.paid;}).length;
  var refurb=it.filter(function(x){return x.usage==='리퍼';}), scrap=it.filter(function(x){return x.usage==='폐기';}).length;
  var rOut=refurb.filter(function(x){return x.refurbOut;}).length;
  var kpis=[
    {l:'총 회수 장비',v:it.length+'대',d:'누적',bc:'#6366f1'},
    {l:'보상처리 완료',v:comp+'대',d:'미처리 '+(it.length-comp),bc:'#10b981'},
    {l:'입금 완료',v:paid+'대',d:'미입금 '+(it.length-paid),bc:'#0ea5e9'},
    {l:'리퍼 재고',v:(refurb.length-rOut)+'대',d:'리퍼 '+refurb.length+' · 출고 '+rOut,bc:'#3b82f6'},
    {l:'폐기',v:scrap+'대',d:'',bc:'#94a3b8'},
    {l:'미회수',v:(DATA.uncollected||[]).length+'대',d:'반납 대기',bc:'#ef4444'}
  ];
  document.getElementById('dashKpi').innerHTML=kpis.map(function(k){return '<div class="kc" style="border-left-color:'+k.bc+'"><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div><div class="d">'+k.d+'</div></div>';}).join('');
  // 조치 필요
  var act=[
    {l:'보상 미처리',n:it.length-comp,f:'comp0',bc:'#f59e0b'},
    {l:'미입금',n:it.length-paid,f:'paid0',bc:'#ef4444'},
    {l:'활용 미정',n:it.filter(function(x){return !x.usage;}).length,f:'usage0',bc:'#eab308'}
  ];
  document.getElementById('dashAction').innerHTML=act.map(function(a){return '<div class="kc" style="border-left-color:'+a.bc+';cursor:pointer" onclick="gotoList(\''+a.f+'\')"><div class="l">'+a.l+'</div><div class="v">'+a.n+'대</div><div class="d" style="color:#3b82f6">클릭 → 목록 조회 ›</div></div>';}).join('');
  // 회수장비별
  var dev={}; it.forEach(function(x){var k=x.recovDev||'(미상)';dev[k]=(dev[k]||0)+1;});
  var dArr=Object.keys(dev).map(function(k){return {k:k,n:dev[k]};}).sort(function(a,b){return b.n-a.n;});
  var dMax=dArr.length?dArr[0].n:1;
  document.getElementById('dashDevHead').innerHTML='<tr><th>회수장비</th><th class="num">대수</th><th style="width:140px">비중</th></tr>';
  document.getElementById('dashDevBody').innerHTML=dArr.slice(0,12).map(function(x){return '<tr class="clk" onclick="drillItems(function(o){return (o.recovDev||\'(미상)\')===\''+dq(x.k)+'\';},\'회수장비: '+dq(x.k)+'\')"><td>'+esc(x.k)+'</td><td class="num" style="font-weight:700">'+x.n+'</td><td><div class="bar"><div style="height:100%;width:'+(x.n/dMax*100)+'%;background:#6366f1"></div></div></td></tr>';}).join('');
  // 담당별
  var rep={}; it.forEach(function(x){var k=x.rep||'(미상)';rep[k]=(rep[k]||0)+1;});
  var rArr=Object.keys(rep).map(function(k){return {k:k,n:rep[k]};}).sort(function(a,b){return b.n-a.n;});
  var rMax=rArr.length?rArr[0].n:1;
  document.getElementById('dashRepHead').innerHTML='<tr><th>영업담당</th><th class="num">대수</th><th style="width:140px">비중</th></tr>';
  document.getElementById('dashRepBody').innerHTML=rArr.slice(0,12).map(function(x){return '<tr class="clk" onclick="drillItems(function(o){return (o.rep||\'(미상)\')===\''+dq(x.k)+'\';},\'담당: '+dq(x.k)+'\')"><td>'+esc(x.k)+'</td><td class="num" style="font-weight:700">'+x.n+'</td><td><div class="bar"><div style="height:100%;width:'+(x.n/rMax*100)+'%;background:#10b981"></div></div></td></tr>';}).join('');
  // 연도별
  var yr={}; it.forEach(function(x){var y=(x.returnDate||'').slice(0,4);if(y.length===4)yr[y]=(yr[y]||0)+1;});
  var yArr=Object.keys(yr).sort();var yMax=Math.max.apply(null,[1].concat(yArr.map(function(y){return yr[y];})));
  document.getElementById('dashYrHead').innerHTML='<tr><th>연도</th><th class="num">회수 대수</th><th style="width:280px"></th></tr>';
  document.getElementById('dashYrBody').innerHTML=yArr.map(function(y){return '<tr class="clk" onclick="drillItems(function(o){return (o.returnDate||\'\').slice(0,4)===\''+y+'\';},\''+y+'년 회수\')"><td>'+y+'년</td><td class="num" style="font-weight:700">'+yr[y]+'</td><td><div class="bar"><div style="height:100%;width:'+(yr[y]/yMax*100)+'%;background:#0ea5e9"></div></div></td></tr>';}).join('');
}
function gotoList(f){ showPage('list'); document.getElementById('fStatus').value=f; renderList(); }

/* ── 회수 내역 ── */
function listFiltered(){
  var q=(document.getElementById('fSearch').value||'').toLowerCase();
  var dev=document.getElementById('fDev').value, rep=document.getElementById('fRep').value;
  var st=document.getElementById('fStatus').value, yr=document.getElementById('fYear').value;
  return (DATA.items||[]).filter(function(x){
    if(dev&&x.recovDev!==dev)return false;
    if(rep&&x.rep!==rep)return false;
    if(yr&&(x.returnDate||'').slice(0,4)!==yr)return false;
    if(st==='comp0'&&x.comp)return false; if(st==='paid0'&&x.paid)return false;
    if(st==='usage0'&&x.usage)return false; if(st==='refurb'&&x.usage!=='리퍼')return false; if(st==='scrap'&&x.usage!=='폐기')return false;
    if(q){var s=(x.clinic+' '+x.serial+' '+x.newDev+' '+x.recovDev+' '+x.rep).toLowerCase();if(s.indexOf(q)<0)return false;}
    return true;
  });
}
function renderList(){
  var rows=listFiltered().slice().sort(function(a,b){return (b.returnDate||'').localeCompare(a.returnDate||'');});
  document.getElementById('listHead').innerHTML='<tr><th>반납일</th><th>거래처</th><th>납품장비</th><th>회수장비</th><th>시리얼</th><th>담당</th><th>보상</th><th>입금</th><th>활용</th><th>리퍼출고</th></tr>';
  document.getElementById('listBody').innerHTML=rows.slice(0,600).map(function(x){var i=DATA.items.indexOf(x);return '<tr class="clk" onclick="openItem('+i+')"><td>'+esc(x.returnDate||'-')+'</td><td>'+esc(x.clinic)+'</td><td>'+esc(x.newDev)+'</td><td>'+esc(x.recovDev)+'</td><td>'+esc(x.serial)+'</td><td>'+esc(x.rep)+'</td><td>'+ynBadge(x.comp,'완료','미처리')+'</td><td>'+ynBadge(x.paid,'완료','미입금')+'</td><td>'+usageBadge(x.usage)+'</td><td>'+(x.refurbOut?'<span class="badge b-refurb">'+esc(x.refurbOut)+'</span>':'-')+'</td></tr>';}).join('')||'<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:20px">데이터 없음</td></tr>';
  document.getElementById('listFoot').textContent='총 '+rows.length+'대'+(rows.length>600?' (600대만 표시)':'');
}
function openItem(i){
  var x=DATA.items[i]; if(!x)return;
  document.getElementById('mTitle').textContent=x.clinic+' · '+x.recovDev+' ('+(x.serial||'-')+')';
  var f=[['거래처',x.clinic],['납품장비(판매)',x.newDev],['회수장비',x.recovDev],['시리얼',x.serial],['제작년도',x.mfgYear],['실제 반납일',x.returnDate],['기안서 반납일',x.draftDate],['보상처리',x.comp?'완료':'미처리'],['매입계산서',x.invoice],['지급요청일',x.payReq],['입금여부',x.paid?'완료':'미입금'],['입금일',x.payDate],['활용여부',x.usage||'미정'],['리퍼출고처',x.refurbOut],['출고일',x.outDate],['영업담당',x.rep],['비고',x.note]];
  document.getElementById('mBody').innerHTML='<dl class="dl">'+f.map(function(p){return '<dt>'+p[0]+'</dt><dd>'+esc(p[1]||'-')+'</dd>';}).join('')+'</dl>';
  document.getElementById('modal').style.display='flex';
}
function drillItems(pred,title){
  var rows=(DATA.items||[]).filter(pred).sort(function(a,b){return (b.returnDate||'').localeCompare(a.returnDate||'');});
  document.getElementById('mTitle').textContent=title+'  ('+rows.length+'대)';
  var h='<div style="overflow-x:auto"><table><thead><tr><th>반납일</th><th>거래처</th><th>납품장비</th><th>회수장비</th><th>시리얼</th><th>담당</th><th>보상</th><th>입금</th><th>활용</th></tr></thead><tbody>';
  h+=rows.map(function(x){return '<tr><td>'+esc(x.returnDate||'-')+'</td><td>'+esc(x.clinic)+'</td><td>'+esc(x.newDev)+'</td><td>'+esc(x.recovDev)+'</td><td>'+esc(x.serial)+'</td><td>'+esc(x.rep)+'</td><td>'+ynBadge(x.comp,'완료','미처리')+'</td><td>'+ynBadge(x.paid,'완료','미입금')+'</td><td>'+usageBadge(x.usage)+'</td></tr>';}).join('')+'</tbody></table></div>';
  document.getElementById('mBody').innerHTML=h;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }

/* ── 미회수 ── */
function renderUncol(){
  var q=(document.getElementById('uSearch').value||'').toLowerCase();
  var rows=(DATA.uncollected||[]).filter(function(x){ if(!q)return true; return (x.clinic+' '+x.serial+' '+x.recovDev+' '+x.rep).toLowerCase().indexOf(q)>=0; });
  document.getElementById('uncolHead').innerHTML='<tr><th>거래처</th><th>납품장비</th><th>회수장비</th><th>시리얼</th><th>납품일</th><th>담당</th><th>입금</th><th>비고</th></tr>';
  document.getElementById('uncolBody').innerHTML=rows.map(function(x){return '<tr><td>'+esc(x.clinic)+'</td><td>'+esc(x.newDev)+'</td><td>'+esc(x.recovDev)+'</td><td>'+esc(x.serial)+'</td><td>'+esc(x.deliveryDate||'-')+'</td><td>'+esc(x.rep)+'</td><td>'+(x.paid?'<span class="badge b-ok">지급</span>':'<span class="badge b-no">미지급</span>')+'</td><td style="white-space:normal;max-width:320px;color:#64748b">'+esc(x.note)+'</td></tr>';}).join('')||'<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px">미회수 없음 🎉</td></tr>';
  document.getElementById('uncolFoot').textContent='총 '+rows.length+'대 미회수';
}

/* ── 리퍼 재고 ── */
function renderRefurb(){
  var refurb=(DATA.items||[]).filter(function(x){return x.usage==='리퍼';});
  var out=refurb.filter(function(x){return x.refurbOut;}).length;
  document.getElementById('refurbKpi').innerHTML=[
    {l:'리퍼 총계',v:refurb.length+'대',bc:'#3b82f6'},{l:'재고(미출고)',v:(refurb.length-out)+'대',bc:'#10b981'},{l:'출고완료',v:out+'대',bc:'#94a3b8'}
  ].map(function(k){return '<div class="kc" style="border-left-color:'+k.bc+'"><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div></div>';}).join('');
  var q=(document.getElementById('rSearch').value||'').toLowerCase(), st=document.getElementById('rStatus').value;
  var rows=refurb.filter(function(x){ if(st==='stock'&&x.refurbOut)return false; if(st==='out'&&!x.refurbOut)return false; if(q&&(x.serial+' '+x.recovDev+' '+x.clinic).toLowerCase().indexOf(q)<0)return false; return true; })
    .sort(function(a,b){return (b.returnDate||'').localeCompare(a.returnDate||'');});
  document.getElementById('refurbHead').innerHTML='<tr><th>상태</th><th>회수장비</th><th>시리얼</th><th>제작년도</th><th>반납일</th><th>원거래처</th><th>출고처</th><th>출고일</th></tr>';
  document.getElementById('refurbBody').innerHTML=rows.map(function(x){return '<tr><td>'+(x.refurbOut?'<span class="badge b-scrap">출고</span>':'<span class="badge b-ok">재고</span>')+'</td><td>'+esc(x.recovDev)+'</td><td>'+esc(x.serial)+'</td><td>'+esc(x.mfgYear)+'</td><td>'+esc(x.returnDate||'-')+'</td><td>'+esc(x.clinic)+'</td><td>'+esc(x.refurbOut||'-')+'</td><td>'+esc(x.outDate||'-')+'</td></tr>';}).join('')||'<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px">데이터 없음</td></tr>';
  document.getElementById('refurbFoot').textContent='표시 '+rows.length+'대';
}
</script>
</body>
